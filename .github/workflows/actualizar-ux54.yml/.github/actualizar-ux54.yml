name: Actualizar datos vivos UX54
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descargar JSON desde Drive
        run: |
          set -e
          URL1="https://drive.usercontent.google.com/download?id=1ZnK6Ax2uU_k6SaFeMFpevQY68xlLwfLS&export=download"
          URL2="https://drive.google.com/uc?export=download&id=1ZnK6Ax2uU_k6SaFeMFpevQY68xlLwfLS"
          curl -fsSL "$URL1" -o ux54-live.json || curl -fsSL "$URL2" -o ux54-live.json
          python3 -c "import json; d=json.load(open('ux54-live.json')); assert 'legs' in d, 'sin legs'; print('OK', d.get('updated_at'))"
      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ux54-live.json
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "Actualizar datos vivos UX54" && git push)
